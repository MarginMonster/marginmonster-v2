name: Render bottle previews

# Renders candidate EASYMODE stand-in bottles (Prime-style silhouette, GStyle
# colors) with the REAL production engine and commits them to the art-previews
# branch for approval in chat before anything ships.
#
# Requires the repo Actions secret: REPLICATE_API_TOKEN

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render bottle candidates
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: node scripts/generate-bottle-previews.mjs
      - name: Commit to art-previews branch
        run: |
          git config user.name "art-preview-bot"
          git config user.email "noreply@easymodeapp.com"
          git checkout -B art-previews
          git add art-previews/
          git commit -m "bottle previews" || echo "nothing new"
          git push -f origin art-previews
