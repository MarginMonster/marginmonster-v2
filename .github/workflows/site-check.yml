name: Site status check

# Curls the public /art-status diagnostics (env-readiness booleans + art
# activity log) so status is checkable from CI logs. No secrets involved.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: art-status summary (easymodeapp.com)
        run: |
          curl -sS -m 30 https://easymodeapp.com/art-status -o /tmp/status.json || true
          python3 - <<'EOF' || head -c 2000 /tmp/status.json
          import json
          j = json.load(open("/tmp/status.json"))
          print("ENV:", json.dumps(j.get("env", {})))
          tiles = [f["name"] for f in j.get("styleTiles", [])]
          ads = [f["name"] for f in j.get("adTemplates", [])]
          print(f"STYLE TILES ({len(tiles)}):", ", ".join(tiles))
          print(f"AD TEMPLATES ({len(ads)}):", ", ".join(ads))
          print("ACTIVITY (last 25):")
          for a in j.get("activity", [])[-25:]:
              print("  ", a)
          EOF
      - name: art-status (onrender host, env only)
        run: curl -sS -m 30 https://marginmonster-fiew.onrender.com/art-status | head -c 800 || true
