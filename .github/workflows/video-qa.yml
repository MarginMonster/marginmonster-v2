name: Video QA (cartoon scripts)

# The cartoon pipeline's script step, swept across every style.
#
# A full cartoon ad is 150 tokens and several minutes, so video cannot be
# swept the way images are. But the bug that prompted this — a presenter
# saying "claymation" out loud mid-ad — lives entirely in the SCRIPT step,
# which is one text call. That part IS cheap to test exhaustively, so it is.
#
# Needs ANTHROPIC_API_KEY only. No renders, no Replicate, pennies per run.

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: 'Scripts per style/product pair — raise to catch rare leaks'
        required: false
        default: "1"
      presenter:
        description: 'Also test the IMAGE-ad presenter path — compose, gate, independent judge (needs FAL_KEY). Costs renders.'
        required: false
        default: ""
      portraits:
        description: 'Comma-separated presenter photo URLs for the presenter test'
        required: false
        default: ""
      keyframe:
        description: 'Also render a stylised keyframe and check the product survived (needs FAL_KEY). Costs renders.'
        required: false
        default: ""
      keyframe_styles:
        description: 'Styles to render for the keyframe check'
        required: false
        default: clay
      portrait_url:
        description: 'Public URL of a presenter photo (keyframe check only)'
        required: false
        default: ""
      product_url:
        description: 'Public URL of the product photo (keyframe check only)'
        required: false
        default: ""
      store_url:
        description: 'Find the product in this storefront instead of pasting a URL'
        required: false
        default: ""
      product_title:
        description: 'Product title (keyframe check only)'
        required: false
        default: ""
      engines:
        description: 'Comma-separated fal compose model ids to A/B against each other (blank = current default)'
        required: false
        default: ""
      product_count:
        description: 'Test this many DISTINCT catalogue products (needs store_url); each pairs with a different presenter'
        required: false
        default: "1"
      product_urls:
        description: 'Explicit product list "url | title ;; url | title" — overrides store_url/product_url discovery'
        required: false
        default: ""
      compose_resolution:
        description: 'Compose output resolution experiment (e.g. 4K) — blank = engine default'
        required: false
        default: ""
      planner_ab:
        description: 'A/B the shot planner (intelligent prompting) against the generic prompt'
        required: false
        default: ""
      commercial:
        description: 'Render one full in-house cinematic Commercial (~$2, needs FAL+Replicate keys)'
        required: false
        default: ""
      health_only:
        description: 'Just diagnose the API keys (fingerprint + auth + billing) and stop — no renders, no AI spend'
        required: false
        default: ""
  push:
    paths:
      - 'app/lib/cartoon-ad-pipeline.server.ts'
      - 'scripts/video-qa.ts'

permissions:
  contents: write

concurrency:
  group: video-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vqa:
    # Cheap enough to run on every touch of the pipeline — unlike the image
    # sweep, this spends text tokens, not renders.
    if: github.event_name == 'workflow_dispatch' || vars.VIDEO_QA_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    # A ten-product sweep is ~10 × (6 parallel composes + pastes + vision QA)
    # ≈ 25 minutes of wall time; 20 was sized for the single-product sweep.
    # The planner A/B (18 4K renders) ran headlong into 45 and got clipped at
    # the finish line; commercial renders add ~20 min of kling wall time.
    timeout-minutes: 75
    steps:
      # Key diagnosis WITHOUT exposing the keys: console-style fingerprint
      # (prefix + last 4 — how console.anthropic.com displays them), auth
      # check, billing check. Born from a top-up that landed on a different
      # org than the key CI uses.
      - name: API key health
        if: inputs.health_only != ''
        env:
          K1: ${{ secrets.ANTHROPIC_API_KEY }}
          K2: ${{ secrets.CLAUDE_API_KEY }}
          C1: ${{ secrets.CREATIFY_API_ID }}
          C2: ${{ secrets.CREATIFY_API_KEY }}
        run: |
          check () {
            name="$1"; key="$2"
            if [ -z "$key" ]; then echo "[$name] not set"; return; fi
            echo "[$name] fingerprint: $(printf %s "$key" | cut -c1-14)...$(printf %s "$key" | rev | cut -c1-4 | rev) (length $(printf %s "$key" | wc -c))"
            auth=$(curl -s -o /tmp/models.json -w "%{http_code}" https://api.anthropic.com/v1/models \
              -H "x-api-key: $key" -H "anthropic-version: 2023-06-01")
            echo "[$name] auth check (GET /v1/models): HTTP $auth"
            bill=$(curl -s -o /tmp/msg.json -w "%{http_code}" https://api.anthropic.com/v1/messages \
              -H "x-api-key: $key" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
              -d '{"model":"claude-haiku-4-5-20251001","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}')
            echo "[$name] billing check (1-token message): HTTP $bill"
            if [ "$bill" != "200" ]; then echo "[$name] error body: $(head -c 300 /tmp/msg.json)"; fi
          }
          check ANTHROPIC_API_KEY "$K1"
          check CLAUDE_API_KEY "$K2"
          # Creatify (Commercial pipeline): credits check without exposing keys
          if [ -n "$C1" ] && [ -n "$C2" ]; then
            cr=$(curl -s -o /tmp/cr.json -w "%{http_code}" https://api.creatify.ai/api/remaining_credits/ \
              -H "X-API-ID: $C1" -H "X-API-KEY: $C2")
            echo "[CREATIFY] credits check: HTTP $cr → $(head -c 120 /tmp/cr.json)"
          else
            echo "[CREATIFY] not set"
          fi
      - name: Stop after health check
        if: inputs.health_only != ''
        run: echo "health_only set — skipping the sweep" && exit 0
      - uses: actions/checkout@v4
        if: inputs.health_only == ''
      - uses: actions/setup-node@v4
        if: inputs.health_only == ''
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Bundle
        run: |
          npx esbuild scripts/video-qa.ts \
            --bundle --platform=node --format=cjs --target=node20 \
            --external:@prisma/client --external:ffmpeg-static --external:ffprobe-static --external:sharp \
            --outfile=video-qa.cjs
      - name: Sweep the scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN || secrets.REPLICATE_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REPEATS: ${{ inputs.repeats || '1' }}
          KEYFRAME: ${{ inputs.keyframe }}
          PRESENTER: ${{ inputs.presenter }}
          QA_PORTRAITS: ${{ inputs.portraits }}
          KEYFRAME_STYLES: ${{ inputs.keyframe_styles || 'clay' }}
          QA_PORTRAIT_URL: ${{ inputs.portrait_url }}
          QA_PRODUCT_URL: ${{ inputs.product_url }}
          QA_STORE_URL: ${{ inputs.store_url }}
          QA_PRODUCT_TITLE: ${{ inputs.product_title }}
          QA_ENGINES: ${{ inputs.engines }}
          QA_PRODUCT_COUNT: ${{ inputs.product_count || '1' }}
          QA_PRODUCT_URLS: ${{ inputs.product_urls }}
          COMPOSE_RESOLUTION: ${{ inputs.compose_resolution }}
          QA_PLANNER_AB: ${{ inputs.planner_ab }}
          QA_COMMERCIAL: ${{ inputs.commercial }}
        run: node video-qa.cjs

      # Publish the actual frames back through git. The replicate.delivery
      # links in the report expire within the hour, and a reviewer working
      # from a sandbox with GitHub-only egress cannot fetch them at all — so
      # the bytes come back on a throwaway branch that is force-pushed each
      # run rather than accumulating binaries on main.
      - name: Publish frames
        if: always()
        run: |
          if [ ! -d qa-out/frames ] || [ -z "$(ls -A qa-out/frames 2>/dev/null)" ]; then
            echo "no frames to publish"; exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp qa-out/frames/* /tmp/pub/
          git checkout --orphan qa-frames
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -not -name .git -not -name . -exec rm -rf {} + 2>/dev/null || true
          mkdir -p frames && cp /tmp/pub/* frames/
          git add -A frames
          git commit -q -m "QA frames from run ${GITHUB_RUN_ID}"
          git push -f origin qa-frames
          echo "published $(ls frames | wc -l) frames to the qa-frames branch"
