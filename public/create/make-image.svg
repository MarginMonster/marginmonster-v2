<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Make an image">
  <defs>
    <linearGradient id="mi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F9F4"/>
      <stop offset="1" stop-color="#F4F1E6"/>
    </linearGradient>
    <linearGradient id="mi-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF6EF"/>
      <stop offset="1" stop-color="#CDEBDA"/>
    </linearGradient>
    <linearGradient id="mi-hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A85E"/>
      <stop offset="1" stop-color="#0A6A3D"/>
    </linearGradient>
    <linearGradient id="mi-hill2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B6D46"/>
      <stop offset="1" stop-color="#14201A"/>
    </linearGradient>
    <radialGradient id="mi-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE39A"/>
      <stop offset="1" stop-color="#F3B63E"/>
    </radialGradient>
    <clipPath id="mi-canvas"><rect x="96" y="92" width="208" height="176" rx="18"/></clipPath>
  </defs>

  <rect width="400" height="400" fill="url(#mi-bg)"/>

  <!-- faint brand rosette, bottom-right corner flourish -->
  <g opacity="0.07">
    <image x="252" y="252" width="210" height="210" href="/gstyle-rosette.svg"/>
  </g>

  <!-- the generated "canvas" -->
  <rect x="96" y="92" width="208" height="176" rx="18" fill="#ffffff" stroke="#E2DCC8" stroke-width="2"/>
  <g clip-path="url(#mi-canvas)">
    <rect x="96" y="92" width="208" height="176" fill="url(#mi-sky)"/>
    <circle cx="246" cy="150" r="26" fill="url(#mi-sun)"/>
    <path d="M96 232 L150 182 L196 220 L236 176 L304 230 L304 268 L96 268 Z" fill="url(#mi-hill2)"/>
    <path d="M96 252 L138 214 L182 244 L226 210 L276 248 L304 226 L304 268 L96 268 Z" fill="url(#mi-hill)"/>
  </g>

  <!-- prompt bar: describe-it, then make-it -->
  <rect x="96" y="286" width="208" height="38" rx="19" fill="#ffffff" stroke="#E2DCC8" stroke-width="2"/>
  <rect x="112" y="300" width="96" height="6" rx="3" fill="#CFC8B2"/>
  <rect x="112" y="312" width="60" height="6" rx="3" fill="#E2DCC8"/>
  <g transform="translate(248 290)">
    <rect width="40" height="30" rx="12" fill="#0C7A46"/>
    <path d="M14 15 L26 15 M21 10 L26 15 L21 20" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles: something made from nothing -->
  <g fill="#B08526">
    <path d="M300 96 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.92"/>
  </g>
  <g fill="#12A85E">
    <path d="M118 74 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z" opacity="0.9"/>
  </g>
  <g fill="#F3B63E">
    <path d="M324 196 l2.6 6.6 6.6 2.6 -6.6 2.6 -2.6 6.6 -2.6 -6.6 -6.6 -2.6 6.6 -2.6 z"/>
  </g>
</svg>
